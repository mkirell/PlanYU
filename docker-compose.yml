services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - "8006:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: sh -c 'mysqladmin ping -h localhost -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" || exit 1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql

  server:
    build: ./server
    image: mohamedkhalilzrelly/planyubs:latest
    container_name: server
    restart: always
    ports:
      - "5006:5000"
    env_file:
      - ./server/.env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: sh -c 'curl -f http://localhost:5000/health || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./server/src:/app/src

  client:
    build: ./client
    image: mohamedkhalilzrelly/planyufc:latest
    container_name: client
    restart: always
    ports:
      - "3006:3000"
    env_file:
      - ./client/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./client/src:/app/src

volumes:
  mysql_data:
