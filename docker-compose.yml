services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql

  server:
    build: ./server
    image: mohamedkhalilzrelly/planyubs:latest
    container_name: server
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mysql
    volumes:
      - ./server/src:/app/src

  client:
    build: ./client
    image: mohamedkhalilzrelly/planyufc:latest
    container_name: client
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src

volumes:
  mysql_data:
